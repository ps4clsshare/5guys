<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋糖飯石鎮 - 搞笑築巢模擬器</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --panel-bg: #ffffff;
            --primary: #2b2b2b;
            --accent: #d9534f;
            --grid-line: #e0ddd5;
            --font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #1a1a1a;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #666;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 500px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: var(--panel-bg);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 2px solid #333;
        }

        .next-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .preview-box {
            width: 50px;
            height: 50px;
            border: 2px dashed #999;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            text-align: center;
            background: #fafafa;
            overflow: hidden;
            font-weight: bold;
        }

        .controls-hint {
            font-size: 0.8rem;
            color: #555;
            text-align: right;
        }

        canvas {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            touch-action: none;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #000;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000;
        }

        button.btn-finish {
            background-color: #d9534f;
            box-shadow: 0 3px 0 #900;
        }

        /* Result Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-card {
            background: #fff;
            border: 4px solid #333;
            border-radius: 8px;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .flyer-header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .flyer-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .flyer-tag {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 2px 10px;
            font-size: 0.85rem;
            margin-top: 5px;
            border-radius: 3px;
        }

        .flyer-comment {
            background: #f8f9fa;
            border: 1px dashed #ccc;
            padding: 12px;
            margin: 15px 0;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.4;
            font-weight: bold;
        }

        .modal-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-secondary {
            background: #6c757d;
            box-shadow: 0 3px 0 #333;
        }

        /* Mobile controls overlay */
        .mobile-controls {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-top: 5px;
        }

        .mobile-btn {
            flex: 1;
            padding: 10px;
            font-size: 1.2rem;
            background: #eee;
            color: #333;
            border: 2px solid #333;
            box-shadow: 0 2px 0 #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>袋糖飯石鎮</h1>
        <p class="subtitle">擺放房間 ➔ 住住睇 ➔ 生成搞笑地產海報</p>
    </header>

    <div class="game-container">
        <div class="top-bar">
            <div class="next-preview">
                <span>下個房間:</span>
                <div class="preview-box" id="previewBox">---</div>
            </div>
            <div class="controls-hint">
                👈 👉 移動 | 👇 落下
            </div>
        </div>

        <canvas id="gameCanvas" width="360" height="480"></canvas>

        <div class="mobile-controls">
            <button class="mobile-btn" id="btnLeft">◀ 左移</button>
            <button class="mobile-btn" id="btnDrop">⬇️ 落下</button>
            <button class="mobile-btn" id="btnRight">右移 ▶</button>
        </div>

        <div class="btn-group">
            <button class="btn-finish" id="btnFinish">🏠 擺完啦！住住睇</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="flyer-header">
                <div class="flyer-title">袋糖飯石鎮</div>
                <div class="flyer-tag" id="flyerTag">評估：疲於奔命</div>
            </div>

            <div class="flyer-comment">
                「成班都真心有撚病。」
            </div>

            <canvas id="flyerCanvas" width="300" height="200" style="border: 1px solid #ccc; margin-bottom: 15px; width:100%; height:auto;"></canvas>

            <div class="modal-btns">
                <button id="btnRestart">🔄 再建一次</button>
            </div>
        </div>
    </div>

<script>
// --- Web Audio API for Sound Effects ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'drop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'speak') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    }
}

// --- Game Configurations ---
const COLS = 6;
const ROWS = 8;
const CELL_SIZE = 60; // 360 x 480 canvas

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Room Types Definitions (Name, W, H, Color, Custom Speech)
const ROOM_TYPES = [
    { name: "藍色!!!", w: 1, h: 1, color: "#4A90E2", quote: "藍色!!!!!!!!!!!!!!!!AAAAAAAAA" },
    { name: "X佬房間", w: 1, h: 2, color: "#7F8C8D", quote: "千~祈~唔~好~呀！" },
    { name: "小肥文", w: 2, h: 1, color: "#FF7675", quote: "131420T?????" },
    { name: "珠海", w: 2, h: 2, color: "#F1C40F", quote: "表姐!!!!!" },
    { name: "KFC", w: 1, h: 1, color: "#E74C3C", quote: "KFC癲忠!!" },
    { name: "聯龍", w: 2, h: 1, color: "#F39C12", quote: "又話我飲左廿支啤酒?？" },
    { name: "AV女優", w: 1, h: 2, color: "#9B59B6", quote: "AV女優做你女朋友制唔制呀???" },
    { name: "肥閪", w: 2, h: 2, color: "#8E44AD", quote: "我屌爆肥閪" },
    { name: "飯子", w: 2, h: 1, color: "#2ECC71", quote: "去文迪丫" },
    { name: "石仔", w: 1, h: 1, color: "#95A5A6", quote: "又BAN!!" },
    { name: "食糖", w: 1, h: 1, color: "#FD79A8", quote: "醒小小啦~~" },
    { name: "彭鎮", w: 2, h: 1, color: "#E67E22", quote: "執野好癲呀~~~" },
    { name: "爛袋", w: 1, h: 2, color: "#D35400", quote: "跑步打拳打雙盃!!!" },
    { name: "芯怡", w: 2, h: 1, color: "#74B9FF", quote: "企起門口睇世界盃!" },
    { name: "關口", w: 2, h: 2, color: "#C0392B", quote: "冇帶行街紙!!!!!" }
];

// Entrance Room (Default at bottom)
const ENTRANCE_ROOM = { name: "玄關關口", w: 2, h: 1, color: "#34495E", quote: "返到嚟啦！" };

let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
let placedRooms = [];

let currentRoom = null;
let nextRoom = null;
let roomX = 2; // Column index

let gameState = "BUILD"; // BUILD, SIMULATE, FINISH

// Character State
let chara = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    currentRoomIdx: -1,
    speech: "",
    speechTimer: 0
};

// Initialize Game
function initGame() {
    grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    placedRooms = [];
    gameState = "BUILD";

    // Place default entrance at bottom middle
    const startX = 2;
    const startY = ROWS - 1;
    const entranceObj = {
        ...ENTRANCE_ROOM,
        x: startX,
        y: startY,
        id: 'entrance'
    };
    placeRoomOnGrid(entranceObj);

    nextRoom = getRandomRoom();
    spawnNextRoom();
    updatePreview();
}

function getRandomRoom() {
    const type = ROOM_TYPES[Math.floor(Math.random() * ROOM_TYPES.length)];
    return { ...type };
}

function spawnNextRoom() {
    currentRoom = nextRoom;
    nextRoom = getRandomRoom();
    roomX = Math.min(COLS - currentRoom.w, 2);
    updatePreview();

    // Check if spawn area is full
    if (!canPlace(currentRoom, roomX, 0)) {
        startSimulation(); // Auto finish if full
    }
}

function updatePreview() {
    document.getElementById('previewBox').innerText = `${nextRoom.name}\n(${nextRoom.w}x${nextRoom.h})`;
    document.getElementById('previewBox').style.background = nextRoom.color;
    document.getElementById('previewBox').style.color = "#fff";
}

function canPlace(room, gx, gy) {
    if (gx < 0 || gx + room.w > COLS) return false;
    if (gy < 0 || gy + room.h > ROWS) return false;

    for (let r = 0; r < room.h; r++) {
        for (let c = 0; c < room.w; c++) {
            if (grid[gy + r][gx + c] !== null) return false;
        }
    }
    return true;
}

function dropRoom() {
    if (gameState !== "BUILD") return;
    initAudio();

    // Find lowest valid Y
    let targetY = 0;
    while (canPlace(currentRoom, roomX, targetY + 1)) {
        targetY++;
    }

    currentRoom.x = roomX;
    currentRoom.y = targetY;
    placeRoomOnGrid(currentRoom);
    playSound('drop');

    spawnNextRoom();
}

function placeRoomOnGrid(room) {
    const roomInstance = { ...room, id: Date.now() + Math.random() };
    placedRooms.push(roomInstance);

    for (let r = 0; r < room.h; r++) {
        for (let c = 0; c < room.w; c++) {
            grid[room.y + r][room.x + c] = roomInstance;
        }
    }
}

// Controls
window.addEventListener('keydown', (e) => {
    if (gameState !== "BUILD") return;
    if (e.key === 'ArrowLeft') {
        if (canPlace(currentRoom, roomX - 1, getTopY())) roomX--;
    } else if (e.key === 'ArrowRight') {
        if (canPlace(currentRoom, roomX + 1, getTopY())) roomX++;
    } else if (e.key === 'ArrowDown' || e.key === ' ') {
        dropRoom();
    }
});

function getTopY() {
    let y = 0;
    while (canPlace(currentRoom, roomX, y + 1)) { y++; }
    return y;
}

document.getElementById('btnLeft').addEventListener('click', () => {
    if (gameState === "BUILD" && canPlace(currentRoom, roomX - 1, getTopY())) roomX--;
});
document.getElementById('btnRight').addEventListener('click', () => {
    if (gameState === "BUILD" && canPlace(currentRoom, roomX + 1, getTopY())) roomX++;
});
document.getElementById('btnDrop').addEventListener('click', () => {
    dropRoom();
});

document.getElementById('btnFinish').addEventListener('click', () => {
    if (gameState === "BUILD") startSimulation();
});

// Start Walking Simulation
function startSimulation() {
    gameState = "SIMULATE";
    document.getElementById('btnFinish').innerText = "模擬住住睇中...";
    document.getElementById('btnFinish').disabled = true;

    // Place Character at Entrance
    const entrance = placedRooms[0];
    chara.x = (entrance.x + 0.5) * CELL_SIZE;
    chara.y = (entrance.y + 0.5) * CELL_SIZE;
    chara.currentRoomIdx = 0;

    chara.speech = "返到嚟啦！擺得幾正喎！";
    chara.speechTimer = 120;
    playSound('speak');

    // Start tour loop
    tourNextRoom();
}

let tourIndex = 0;
function tourNextRoom() {
    if (placedRooms.length <= 1) {
        setTimeout(showFinalResult, 2000);
        return;
    }

    tourIndex = (tourIndex + 1) % placedRooms.length;
    const targetRoom = placedRooms[tourIndex];

    chara.targetX = (targetRoom.x + targetRoom.w / 2) * CELL_SIZE;
    chara.targetY = (targetRoom.y + targetRoom.h / 2) * CELL_SIZE;

    setTimeout(() => {
        chara.speech = targetRoom.quote || "呢度幾好喎！";
        chara.speechTimer = 150;
        playSound('speak');

        if (tourIndex < placedRooms.length - 1) {
            setTimeout(tourNextRoom, 2500);
        } else {
            setTimeout(showFinalResult, 3000);
        }
    }, 1000);
}

// Show Final Result Modal & Draw Flyer
function showFinalResult() {
    gameState = "FINISH";
    document.getElementById('resultModal').style.display = 'flex';

    // Draw Thumbnail on Flyer Canvas
    const fCanvas = document.getElementById('flyerCanvas');
    const fCtx = fCanvas.getContext('2d');
    fCtx.fillStyle = "#fff";
    fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);

    // Render scaled mini house
    const scale = 0.4;
    const offsetX = 30;
    const offsetY = 10;

    placedRooms.forEach(room => {
        fCtx.fillStyle = room.color;
        fCtx.fillRect(offsetX + room.x * CELL_SIZE * scale, offsetY + room.y * CELL_SIZE * scale, room.w * CELL_SIZE * scale, room.h * CELL_SIZE * scale);
        fCtx.strokeStyle = "#333";
        fCtx.strokeRect(offsetX + room.x * CELL_SIZE * scale, offsetY + room.y * CELL_SIZE * scale, room.w * CELL_SIZE * scale, room.h * CELL_SIZE * scale);
    });
}

document.getElementById('btnRestart').addEventListener('click', () => {
    document.getElementById('resultModal').style.display = 'none';
    document.getElementById('btnFinish').innerText = "🏠 擺完啦！住住睇";
    document.getElementById('btnFinish').disabled = false;
    initGame();
});

// Render Game Loop
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines
    ctx.strokeStyle = "#e0ddd5";
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_SIZE);
        ctx.lineTo(canvas.width, r * CELL_SIZE);
        ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, canvas.height);
        ctx.stroke();
    }

    // Draw Placed Rooms
    placedRooms.forEach(room => {
        ctx.fillStyle = room.color;
        ctx.fillRect(room.x * CELL_SIZE + 2, room.y * CELL_SIZE + 2, room.w * CELL_SIZE - 4, room.h * CELL_SIZE - 4);
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.strokeRect(room.x * CELL_SIZE + 2, room.y * CELL_SIZE + 2, room.w * CELL_SIZE - 4, room.h * CELL_SIZE - 4);

        // Room Text
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 3;
        ctx.fillText(room.name, (room.x + room.w / 2) * CELL_SIZE, (room.y + room.h / 2) * CELL_SIZE);
        ctx.shadowBlur = 0;
    });

    // Draw Dropping Room Preview
    if (gameState === "BUILD" && currentRoom) {
        let dropY = getTopY();

        // Shadow indicator
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(roomX * CELL_SIZE, dropY * CELL_SIZE, currentRoom.w * CELL_SIZE, currentRoom.h * CELL_SIZE);

        // Active Falling Piece
        ctx.fillStyle = currentRoom.color;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(roomX * CELL_SIZE + 2, dropY * CELL_SIZE + 2, currentRoom.w * CELL_SIZE - 4, currentRoom.h * CELL_SIZE - 4);
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = "#000";
        ctx.strokeRect(roomX * CELL_SIZE + 2, dropY * CELL_SIZE + 2, currentRoom.w * CELL_SIZE - 4, currentRoom.h * CELL_SIZE - 4);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(currentRoom.name, (roomX + currentRoom.w / 2) * CELL_SIZE, (dropY + currentRoom.h / 2) * CELL_SIZE);
    }

    // Draw Character & Speech Bubble
    if (gameState === "SIMULATE") {
        // Move towards target
        chara.x += (chara.targetX - chara.x) * 0.1;
        chara.y += (chara.targetY - chara.y) * 0.1;

        // Character Body (Cute Yellow Circle)
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(chara.x, chara.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eyes
        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(chara.x - 4, chara.y - 3, 2, 0, Math.PI * 2);
        ctx.arc(chara.x + 4, chara.y - 3, 2, 0, Math.PI * 2);
        ctx.fill();

        // Speech Bubble
        if (chara.speechTimer > 0) {
            chara.speechTimer--;
            ctx.fillStyle = "#fff";
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;

            const bubbleW = ctx.measureText(chara.speech).width + 20;
            const bubbleH = 30;
            const bx = Math.min(Math.max(chara.x - bubbleW / 2, 10), canvas.width - bubbleW - 10);
            const by = chara.y - 45;

            ctx.fillRect(bx, by, bubbleW, bubbleH);
            ctx.strokeRect(bx, by, bubbleW, bubbleH);

            ctx.fillStyle = "#000";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(chara.speech, bx + bubbleW / 2, by + bubbleH / 2);
        }
    }

    requestAnimationFrame(render);
}

// Start Game
initGame();
render();
</script>
</body>
</html>
